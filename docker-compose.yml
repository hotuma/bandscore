version: '3.8'

services:
  beatnet-service:
    build:
      context: .
      dockerfile: Dockerfile.beatnet
    container_name: beatnet-service
    ports:
      - "8001:8000"
    networks:
      - bandscore-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bandscore-backend
    ports:
      - "8000:8000"
    environment:
      - BEATNET_URL=http://beatnet-service:8000
    depends_on:
      beatnet-service:
        condition: service_healthy
    networks:
      - bandscore-network
    volumes:
      - ./backend:/app

networks:
  bandscore-network:
    driver: bridge
