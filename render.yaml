services:
  - type: web
    name: bandscore-backend
    env: docker
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: MAX_ANALYSIS_SEC
        value: 60
      - key: CHUNK_SEC
        value: 15
      - key: FIRST_CHUNK_SEC
        value: 15
      - key: LOW_MEMORY_CHROMA
        value: 1
      - key: ENABLE_LIBROSA_WARMUP
        value: 0
      - key: PROCESS_JOBS_INLINE
        value: "false"
      - key: STORAGE_BACKEND
        value: r2
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_REGION
        sync: false

  - type: worker
    name: bandscore-worker
    env: docker
    plan: starter
    dockerCommand: python worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: MAX_ANALYSIS_SEC
        value: 60
      - key: CHUNK_SEC
        value: 15
      - key: FIRST_CHUNK_SEC
        value: 15
      - key: LOW_MEMORY_CHROMA
        value: 1
      - key: ENABLE_LIBROSA_WARMUP
        value: 0
      - key: STORAGE_BACKEND
        value: r2
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_REGION
        sync: false
